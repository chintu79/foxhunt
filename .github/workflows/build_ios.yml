name: Build iOS Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Release Package
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application Bundle
        run: flutter build ios --release --no-codesign

      - name: Package Payload into unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FoxHunt_iOS.ipa Payload
          zip -r FoxHunt_iOS_App.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxHunt_iOS_Package
          path: |
            FoxHunt_iOS.ipa
            FoxHunt_iOS_App.zip
